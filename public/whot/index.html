<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a30">
<title>Check Up Whot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one-screen card table. Opponent seats along the top, market and discard piles in the middle,
   your fanned hand along the bottom, one action bar under it. Single committed look: lagoon-green baize, warm card faces, red Whot backs. */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --felt:#0b2a30; --felt-hi:#15454d; --panel:#133a42; --panel-hi:#1a4851; --line:rgba(255,255,255,.14);
  --text:#ebf5f2; --muted:#9cbcb7;
  --accent:#ffc247; --accent-ink:#2b1c00; --danger:#ff9185; --good:#7fe0a8;
  --card:#fbf7ee; --card-ink:#1c1d22; --back:#c7312c; --back-hi:#e4584f;
  --circle:#e5473f; --circle-ink:#b3261e;
  --triangle:#1f9d62; --triangle-ink:#117040;
  --cross:#8a57d6; --cross-ink:#5b31a2;
  --square:#2a73dc; --square-ink:#1a4fa3;
  --star:#e8a712; --star-ink:#895b00;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
html,body{height:100%}
body{
  margin:0; padding-inline:16px; padding-block:0;
  background-color:var(--felt);
  background-image:radial-gradient(120% 70% at 50% 40%,var(--felt-hi) 0%,var(--felt) 64%);
  background-attachment:fixed;
  color:var(--text); font:400 15px/1.4 var(--font-body);
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
#app{height:100%; max-width:560px; margin:0 auto}
.screen{height:100%; overflow-y:auto; overflow-x:hidden}

/* ---------- symbols & cards ---------- */
.sym{width:1em; height:1em; flex:none}
.s-circle{--c:var(--circle); --ink:var(--circle-ink)}
.s-triangle{--c:var(--triangle); --ink:var(--triangle-ink)}
.s-cross{--c:var(--cross); --ink:var(--cross-ink)}
.s-square{--c:var(--square); --ink:var(--square-ink)}
.s-star{--c:var(--star); --ink:var(--star-ink)}
.s-whot{--c:var(--card-ink); --ink:var(--card-ink)}
.c-circle{color:var(--circle)} .c-triangle{color:var(--triangle)} .c-cross{color:var(--cross)} .c-square{color:var(--square)} .c-star{color:var(--star)}

/* Card face geometry, in units of f (= width/4):
   card height 6f. Corner block (number + small shape) takes 0.3f..1.86f from the top and the same from the bottom.
   The middle band is inset 2f top and bottom, so the big shape can never touch the small ones. */
.card{
  --w:64px; position:relative; flex:none; display:block; padding:0; border:0; text-align:center;
  width:var(--w); height:calc(var(--w)*1.5); font-size:calc(var(--w)*.25); line-height:1;
  border-radius:calc(var(--w)*.11); background:var(--card); color:var(--ink,var(--card-ink));
  font-family:var(--font-display); user-select:none; -webkit-user-select:none;
  box-shadow:0 1px 0 rgba(0,0,0,.3),0 8px 14px -8px rgba(0,0,0,.7);
  transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
}
.corner{position:absolute; display:flex; flex-direction:column; align-items:center; gap:.06em; font-weight:800; line-height:1}
.corner .sym{width:.5em; height:.5em; color:var(--c)}
.corner.tl{top:.3em; left:.34em}
.corner.br{bottom:.3em; right:.34em; transform:rotate(180deg)}
.mid{position:absolute; left:.3em; right:.3em; top:2em; bottom:2em; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.1em}
.mid .pip{width:1.9em; height:1.9em; color:var(--c)}
.mid.sp .pip{width:1.35em; height:1.35em}
.tag{font:700 .46em/1 var(--font-body); letter-spacing:.06em; white-space:nowrap; color:var(--ink)}
.mid.joker{gap:.2em}
.joker i{font-style:normal; font-weight:800; font-size:1em; letter-spacing:.04em; line-height:1}
.joker .row{display:flex; gap:.12em}
.joker .row .sym{width:.5em; height:.5em}
.card.back{
  background:radial-gradient(circle at 50% 50%,var(--back-hi) 0 17%,transparent 18%),
             repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 2px,transparent 2px 8px),var(--back);
  border:calc(var(--w)*.055) solid var(--card);
}
.card.back::after{content:""; position:absolute; inset:18%; border:2px solid rgba(255,255,255,.55); border-radius:50%}
.card.mini{--w:38px}
.card.mini .tag,.card.mini .corner.br{display:none}
.card.mini .mid.sp .pip{width:1.9em; height:1.9em}

/* flying cards (deal, market, plays, reshuffle) */
.flyer{position:fixed; z-index:70; pointer-events:none; will-change:transform}
.flyer .card{box-shadow:0 12px 22px -6px rgba(0,0,0,.65)}

/* hand */
.hand-wrap{display:flex; flex-direction:column; gap:2px}
.hand-label{display:flex; justify-content:space-between; align-items:baseline; font-size:.8rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; padding-inline:2px}
.hand-label b{color:var(--text); font-family:var(--font-display); font-size:.95rem; letter-spacing:0; text-transform:none}
#hand{overflow-x:auto; overflow-y:hidden; min-height:126px; padding-top:44px; margin-top:-44px; scrollbar-width:thin; -webkit-overflow-scrolling:touch}
.fan{display:flex; flex-direction:column; align-items:center; width:max-content; margin:0 auto; padding:20px 4px 6px}
.fan-row{display:flex}
/* Big hands wrap into overlapping rows. Each back row still shows its cards' numbers and small shapes. */
.fan.multi .fan-row+.fan-row{margin-top:-50px}
/* the card under a scrubbing finger: lifted clear of the finger and enlarged */
.fan .card.peek{transform:translateY(-46px) scale(1.28); z-index:9; filter:none; box-shadow:0 0 0 2px var(--accent),0 18px 26px -8px rgba(0,0,0,.85); transition:transform .08s ease}
@media (hover:hover) and (pointer:fine){
  .fan .card:not(.sel):hover{transform:translateY(-12px); z-index:7; filter:none}
}
.hand-label b{white-space:nowrap}
.hand-label:empty{display:none}
#nameForm{display:flex; flex-direction:column; gap:12px; margin-top:6px}
#nameForm input{width:100%; min-height:48px}
#nameForm .sheet-actions{margin:0; display:block}
#nameForm .sheet-actions .btn{width:100%}
.hand-label{align-items:center; position:relative; z-index:2}   /* above the hand's pop-up headroom */
.fan .card{--w:64px; cursor:pointer}
.fan .card.sel{transform:translateY(-18px); z-index:6; box-shadow:0 0 0 3px var(--accent),0 14px 20px -8px rgba(0,0,0,.8)}
.fan .card.nope{animation:nope .35s}
.fan .card.fresh{animation:fresh .38s cubic-bezier(.2,.8,.3,1.3)}
.fan .card.incoming{visibility:hidden}
.fan .card[data-ord]::after{content:attr(data-ord); position:absolute; top:-9px; right:-7px; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font:800 .8rem/22px var(--font-body); text-align:center; box-shadow:0 2px 6px rgba(0,0,0,.5)}
.hand-note{display:grid; place-items:center; min-height:126px; text-align:center; color:var(--muted); padding:0 12px}

/* seats */
.seats{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px}
.seat{min-width:0; padding:8px 10px 9px; border-radius:14px; background:rgba(7,28,33,.55); border:1px solid var(--line); display:flex; flex-direction:column; gap:3px}
.seat.active{border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,194,71,.28)}
.seat-top{display:flex; align-items:center; gap:6px; min-width:0}
.seat-name{font:700 .92rem var(--font-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.tag-sm{flex:none; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 4px}
.seat-mid{display:flex; align-items:baseline; gap:6px; font-size:.82rem; color:var(--muted)}
.seat-mid .count{font:500 1.15rem var(--font-mono); color:var(--text)}
.seat-mid .last{margin-left:auto; color:var(--accent-ink); background:var(--accent); font-weight:700; font-size:.66rem; border-radius:6px; padding:1px 5px; letter-spacing:.03em}
.mini-fan{display:flex; height:22px; align-items:center; padding-left:2px}
.mini-fan .card{--w:14px; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.5); margin-left:-6px}
.mini-fan .card:first-child{margin-left:0}
.mini-fan .card.back{border-width:1px}
.mini-fan .card.back::after{display:none}
.mini-fan .more{font:500 .72rem var(--font-mono); color:var(--muted); margin-left:5px}

/* table */
.table{position:relative; flex:1 1 auto; min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px}
.table::before{content:""; position:absolute; inset:2% 0; border:1.5px solid rgba(255,255,255,.07); border-radius:50%; pointer-events:none}
.piles{display:flex; gap:22px; align-items:flex-end; justify-content:center}
.pile{display:flex; flex-direction:column; align-items:center; gap:8px}
.pile-label{font-size:.78rem; color:var(--muted); letter-spacing:.05em; text-transform:uppercase}
.pile-label .mono{color:var(--text)}
.stack{position:relative; width:84px; height:126px}
.stack .card{position:absolute; left:0; top:0; --w:84px}
.stack .card:nth-child(1){transform:translate(-4px,4px) rotate(-3deg)}
.stack .card:nth-child(2){transform:translate(-2px,2px) rotate(1.5deg)}
.stack.empty .card{opacity:.14}
.stack.shuffling .card:nth-child(1){animation:riffleL .45s ease-in-out infinite alternate}
.stack.shuffling .card:nth-child(2){animation:riffleR .45s ease-in-out infinite alternate}
.stack.shuffling .card:nth-child(3){animation:riffleU .45s ease-in-out infinite alternate}
.disc{position:relative; width:104px; height:156px}
.disc .card{--w:104px; position:absolute; left:0; top:0}
.disc .card.under{transform:rotate(-7deg) translate(-8px,2px); filter:brightness(.8)}
.disc .card.land{animation:land .38s cubic-bezier(.2,.8,.3,1.1)}
.disc .slot{position:absolute; inset:0; border:2px dashed rgba(255,255,255,.2); border-radius:11px}
.shape-chip{display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 9px; border-radius:99px; border:1px solid var(--line); background:rgba(7,28,33,.55); font-size:.84rem; color:var(--muted)}
.shape-chip.off{visibility:hidden}
.shape-chip .sym{width:1.25em; height:1.25em}
.shape-chip b{color:var(--text); font-family:var(--font-display); font-weight:700; text-transform:capitalize}

/* status & actions */
.status{min-height:3.7em; display:flex; flex-direction:column; justify-content:center; gap:2px; text-align:center}
.banner{font:700 1.02rem/1.25 var(--font-display); text-wrap:balance}
.banner.alert{color:var(--danger)}
.banner.hint{color:var(--accent)}
.ticker{font-size:.84rem; color:var(--muted); min-height:1.2em}
.ticker.hit{color:var(--accent)} .ticker.warn{color:var(--danger)} .ticker.ok{color:var(--good)}
.actions{display:grid; grid-template-columns:1fr 1.5fr; gap:10px; padding-block:6px calc(10px + env(safe-area-inset-bottom,0px))}
.btn{min-height:50px; padding:0 18px; border-radius:14px; border:1.5px solid var(--line); background:rgba(7,28,33,.6); font-weight:700; font-size:1rem; letter-spacing:.01em}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.danger{border-color:var(--danger); color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.38; cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}

/* game shell */
#game{display:flex; flex-direction:column; gap:10px; padding-top:8px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:8px}
.wordmark{font:800 1.15rem var(--font-display); letter-spacing:-.01em}
.wordmark span{color:var(--accent)}
.topbtns{display:flex; gap:6px}
.chip-btn{min-height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:rgba(7,28,33,.55); font-size:.86rem; font-weight:600}

/* setup */
#setup{display:flex; flex-direction:column; gap:20px; padding-block:18px 24px}
.hero{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.hero-fan{position:relative; height:160px; width:220px; margin-bottom:4px}
.hero-fan .card{--w:90px; position:absolute; left:50%; top:8px; margin-left:-45px; transform-origin:50% 120%}
.eyebrow{font-size:.74rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700}
h1{font:800 clamp(2.7rem,15vw,3.9rem)/.95 var(--font-display); letter-spacing:-.03em}
.sub{color:var(--muted); max-width:34ch; text-wrap:balance}
.field-title{font:700 1.05rem var(--font-display); margin-bottom:8px}
.seg{display:inline-flex; padding:3px; border-radius:12px; background:rgba(7,28,33,.65); border:1px solid var(--line)}
.seg button{border:0; background:transparent; min-height:40px; min-width:48px; padding:0 14px; border-radius:9px; font-weight:700; color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent); color:var(--accent-ink)}
.seg.small button{min-height:36px; padding:0 10px; font-size:.88rem; min-width:0}
#seatList{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.seat-row{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:8px; align-items:center}
.seat-no{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font:500 .85rem var(--font-mono); background:var(--panel-hi); color:var(--muted)}
input[type=text]{width:100%; min-height:44px; padding:0 12px; border-radius:11px; border:1px solid var(--line); background:rgba(7,28,33,.6); color:var(--text); font:600 1rem var(--font-body)}
.note{color:var(--danger); font-size:.86rem; min-height:1.3em; margin-top:8px}
.setup-actions{display:flex; flex-direction:column; gap:10px}

/* overlays */
.overlay{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:24px; background:var(--felt); background-image:radial-gradient(120% 70% at 50% 40%,var(--felt-hi) 0%,var(--felt) 64%)}
.pass-box{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; max-width:340px}
.pass-box h2{font:800 2rem/1.05 var(--font-display); letter-spacing:-.02em; text-wrap:balance}
.pass-box p{color:var(--muted)}
.pass-box .btn{width:100%}
.pass-box .recap{font-size:.86rem; color:var(--accent)}
.sheet{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center}
.sheet-back{position:absolute; inset:0; background:rgba(2,12,15,.66)}
.sheet-panel{position:relative; width:min(560px,100%); max-height:88%; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-bottom:0; border-radius:22px 22px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px; animation:rise .25s ease-out}
.sheet-panel h2{font:800 1.5rem/1.1 var(--font-display); letter-spacing:-.02em; text-wrap:balance}
.sheet-close{position:absolute; top:10px; right:10px; width:40px; height:40px; border-radius:50%; border:0; background:var(--panel-hi); font-size:1.2rem; line-height:1}
.rules-list{display:flex; flex-direction:column; gap:10px; margin:0; padding:0; list-style:none}
.rules-list li{display:grid; grid-template-columns:64px minmax(0,1fr); gap:12px; align-items:start}
.rule-badge{display:grid; place-items:center; height:34px; border-radius:9px; background:var(--card); color:var(--card-ink); font:800 1rem var(--font-display)}
.rules-list b{font-family:var(--font-display)}
.rules-list span{color:var(--muted)}
.rules-p{color:var(--muted)}
.rules-p b{color:var(--text)}
.log-list{display:flex; flex-direction:column; gap:6px; margin:0; padding:0; list-style:none}
.log-list li{font-size:.92rem; padding:7px 10px; border-radius:9px; background:rgba(7,28,33,.5)}
.log-list li.hit{color:var(--accent)} .log-list li.warn{color:var(--danger)} .log-list li.ok{color:var(--good)}
.shape-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:10px}
.shape-btn{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:14px; border:1.5px solid var(--line); background:rgba(7,28,33,.55); font-weight:700; text-transform:capitalize}
.shape-btn .sym{width:34px; height:34px; color:var(--c)}
.res{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.res li{padding:10px 12px; border-radius:14px; background:rgba(7,28,33,.5); border:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
.res li.win{border-color:var(--good)}
.res li.lose{border-color:var(--danger)}
.res-head{display:flex; align-items:center; gap:8px; min-width:0}
.res-head b{font:700 1rem var(--font-display); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.res-head .mono{margin-left:auto; color:var(--muted); font-size:.85rem; white-space:nowrap}
.badge{flex:none; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; padding:2px 7px; border-radius:6px}
.badge.w{background:var(--good); color:#06271a}
.badge.l{background:var(--danger); color:#380a05}
.minis{display:flex; flex-wrap:wrap; gap:5px}
.score{width:100%; border-collapse:collapse; font-size:.92rem}
.score th{font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:right; font-weight:600; padding:4px 6px}
.score th:first-child,.score td:first-child{text-align:left}
.score td{padding:6px; text-align:right; border-top:1px solid var(--line); font-family:var(--font-mono)}
.score td:first-child{font-family:var(--font-body); font-weight:600}
.sheet-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px}

@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fresh{from{transform:scale(.72); opacity:.4}to{transform:none; opacity:1}}
@keyframes land{from{transform:scale(1.25) rotate(6deg); opacity:.3}to{transform:none; opacity:1}}
@keyframes rise{from{transform:translateY(30px); opacity:0}to{transform:none; opacity:1}}
@keyframes riffleL{from{transform:translate(-30px,4px) rotate(-9deg)}to{transform:translate(-4px,4px) rotate(-3deg)}}
@keyframes riffleR{from{transform:translate(30px,2px) rotate(9deg)}to{transform:translate(0,2px) rotate(1.5deg)}}
@keyframes riffleU{from{transform:translateY(-10px)}to{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
@media (max-height:680px){
  .disc{width:88px; height:132px} .disc .card{--w:88px}
  .stack{width:72px; height:108px} .stack .card{--w:72px}
  .table{min-height:160px}
}
.home{align-self:flex-start; color:var(--muted); text-decoration:none; font-weight:600; font-size:.9rem; padding:6px 10px 6px 0; min-height:36px; display:inline-flex; align-items:center}
.home:hover,.home:focus-visible{color:var(--accent)}
/* ---------- layout: the page scrolls, not a column ---------- */
/* The old setup screen was a 560px column with its own scrollbar, which on a wide window drew a stripe through
   the middle of the screen. Now the setup uses the whole window and the window scrolls. */
html{scrollbar-gutter:stable}
body:has(#setup:not([hidden])) #app{height:auto; min-height:100%; max-width:1040px}
#setup.screen{height:auto; overflow:visible}
#setup{padding-block:clamp(18px,4vw,40px) 40px}
#game.screen{scrollbar-width:none}
#game.screen::-webkit-scrollbar{display:none}
.hero-fan{width:min(260px,70vw); height:170px}
.hero-fan .card{--w:96px; margin-left:-48px}
@media (min-width:900px){
  #setup{display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,460px); column-gap:clamp(40px,7vw,96px); row-gap:20px; align-content:center; align-items:start; min-height:100vh; min-height:100dvh}
  #setup .hero{grid-column:1; grid-row:1 / span 4; align-self:center; align-items:flex-start; text-align:left; gap:14px; position:sticky; top:12vh}
  #setup .hero h1{font-size:clamp(4rem,7vw,5.6rem)}
  #setup .hero .sub{max-width:30ch; font-size:1.1rem}
  #setup .hero-fan{width:300px; height:200px; margin:0 0 10px -18px}
  #setup .hero-fan .card{--w:112px; margin-left:-56px}
  #setup > section,#setup > .setup-actions{grid-column:2}
  #setup .online{margin-top:6px}
}
@media (min-width:900px) and (max-height:760px){
  #setup .hero{position:static}
}
/* seat requests */

/* ---------- check up: the big moment ---------- */
.bang{position:fixed; inset:0; z-index:90; display:grid; place-items:center; overflow:hidden; cursor:pointer;

.bang-text b{font:800 clamp(3.4rem,17vw,8rem)/.88 var(--font-display); letter-spacing:-.045em; color:var(--accent);
  text-shadow:0 6px 0 #9a5d00,0 20px 44px rgba(0,0,0,.6); animation:slam .75s cubic-bezier(.2,1.6,.4,1) both}
.bang-text span{font:700 clamp(1.1rem,4.6vw,1.7rem)/1.2 var(--font-display); color:#fff; animation:riseIn .5s .35s both}
.bit{position:absolute; left:50%; top:45%; width:24px; height:24px; margin:-12px; z-index:1; pointer-events:none}

.chip-btn.icon{width:36px; padding:0; display:inline-grid; place-items:center}

/* ---------- online ---------- */
[hidden]{display:none!important}

/* live tables: a grid of small tiles that scales to many rooms, scrolling inside its own box */
.tables{display:flex; flex-direction:column; gap:10px}

.tscroll{max-height:236px; overflow-y:auto; overscroll-behavior:contain; margin:-2px; padding:2px; scrollbar-width:thin}
.tscroll.more{-webkit-mask-image:linear-gradient(#000 82%,transparent); mask-image:linear-gradient(#000 82%,transparent)}
.tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:8px}
.tile{position:relative; display:flex; flex-direction:column; min-width:0; border-radius:14px; border:1px solid var(--line); background:linear-gradient(160deg,rgba(26,72,81,.62),rgba(7,28,33,.7)); overflow:hidden; transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px); border-color:rgba(255,194,71,.6)}

.seatrow{display:flex; gap:4px; align-items:center; height:16px}

.tact{margin-top:2px; display:inline-flex; align-items:center; justify-content:center; min-height:30px; border-radius:9px; font-size:.82rem; font-weight:700; background:rgba(255,255,255,.08)}

.tile-eye svg{width:16px; height:16px}
.tile.none{grid-column:1/-1; padding:14px; flex-direction:row; align-items:center; gap:12px; color:var(--muted); font-size:.9rem; border-style:dashed; background:rgba(7,28,33,.35)}

.tile.none .ring{width:30px; height:30px; flex:none; border-radius:50%; border:2px solid rgba(255,255,255,.2); display:grid; place-items:center}
.tile.none .ring::after{content:""; width:8px; height:8px; border-radius:50%; background:var(--muted)}
/* joining by code: its own small form, apart from the tiles */
.codeform{display:flex; flex-direction:column; gap:8px; padding:12px 14px; border-radius:14px; border:1px dashed var(--line); background:rgba(7,28,33,.3)}

.codeform #joinBtn.bad{border-color:#ff6b5e; color:#ffb4ac; background:rgba(255,107,94,.1)}
@media (prefers-reduced-motion:reduce){.tables-head h2::before{animation:none}.tile{transition:none}}
.chip-btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.wordmark .net-tag{font:500 .72rem var(--font-mono); letter-spacing:.08em; color:var(--good); border:1px solid var(--line); border-radius:6px; padding:2px 6px; margin-left:8px; vertical-align:middle}

#toast{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:80; max-width:min(92vw,420px); padding:9px 14px; border-radius:12px; background:var(--panel-hi); border:1px solid var(--line); box-shadow:0 10px 24px -8px rgba(0,0,0,.7); font-weight:600; font-size:.92rem; text-align:center; pointer-events:none; transition:opacity .25s}

/* ================= around the table ================= */
/* A mahogany card table with a baize inlay, in a warm, dim room. You sit at the bottom with your hand;
   the others sit around the rim in play order: next player on your left, then across, then on your right. */
body:has(#game:not([hidden])){background-color:#120c09; background-image:radial-gradient(95% 75% at 50% 42%,#3b2519 0%,#1b120c 55%,#0b0705 100%)}

#game{gap:8px}
.arena{position:relative; flex:1 1 auto; min-height:320px; margin-inline:-8px}
.tabletop,.arena .table{position:absolute; inset:36px 8px 30px}
.tabletop{border-radius:50%/46%;
  background:
    radial-gradient(120% 80% at 50% 8%,rgba(255,214,176,.22),transparent 55%),
    repeating-linear-gradient(97deg,rgba(0,0,0,.13) 0 2px,transparent 2px 7px,rgba(0,0,0,.06) 7px 8px,transparent 8px 15px),
    repeating-linear-gradient(83deg,rgba(255,236,214,.05) 0 1px,transparent 1px 11px),

.felt{position:absolute; inset:14px; border-radius:50%/46%;
  background:radial-gradient(110% 90% at 50% 40%,#21805a 0%,#145a3e 55%,#0c3b29 100%);
  box-shadow:inset 0 0 0 2px rgba(222,178,112,.45),inset 0 0 0 5px rgba(0,0,0,.25),inset 0 12px 32px rgba(0,0,0,.55)}
.felt::after{content:""; position:absolute; inset:0; border-radius:inherit; opacity:.35; mix-blend-mode:overlay;

.arena .table{min-height:0; gap:8px; z-index:1}

    <div class="talk-note" id="talkNote" role="status" aria-live="polite" hidden></div>
    <div class="actions">
      <button class="btn" id="marketBtn" type="button">Market</button>
      <button class="btn primary" id="playBtn" type="button">Play card</button>
      <button class="ptt" id="pttBtn" type="button" hidden aria-label="Walkie-talkie: hold to talk to the other players">
        <canvas id="pttWave" width="112" height="112" aria-hidden="true"></canvas>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6.5V2"/><rect x="7" y="6.5" width="11" height="16" rx="2.5"/><path d="M4.5 10v4.5" stroke-width="2.4"/><path d="M10 10h5M10 12.5h5M10 15h5"/><rect x="10" y="18" width="5" height="2.5" rx=".6" fill="currentColor" stroke="none"/></svg><span>Walkie-talkie</span>
      </button>
    </div>
  </main>
</div>

<div class="overlay" id="pass" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">&times;</button>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="off" role="status" aria-live="polite"></div>
<script src="/shared/share.js"></script>
<script type="module" src="app.js"></script>
</body></html>
